name: ci

# 触发：主分支推送 + 所有 PR
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 只跑 3.10 与 3.12：
        # - 3.10 是验收基线（SPEC §1 / README「安装」段），必须绿；
        # - 3.12 是开发组依赖（numpy 2.5.4 等），保证上限兼容；
        # - **故意不跑 3.11**：requirements.txt 里 3.11 与 3.10 落在同一依赖分组
        #   （`python_version < 3.12`），覆盖率与 3.10 完全等价，加节点只是浪费算力。
        #   若将来依赖分组改成三段，再补 3.11 并同步更新本注释。
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 刻意**不装** requirements-ocr.txt：保证 S6 的降级路径在 CI 上持续被覆盖
      # （引擎缺失 → text="" / confidence=0 / engine="none" + WARN）。

      - name: Verify pinned wheels
        run: python scripts/verify_wheels.py --check

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -m pytest -q --tb=no > pytest.log 2>&1
          rc=$?
          tail -40 pytest.log
          python scripts/ci_report_status.py pytest.log "$rc"
          exit $rc

      - name: Check contracts
        run: python scripts/check_contracts.py

      - name: Smoke convert (end-to-end)
        run: |
          python -m src convert --image test_images/synthetic_line_single.png --out outputs/ci_smoke
          test -f outputs/ci_smoke/drawing.dxf
          test -f outputs/ci_smoke/metrics_s8.json

  # Windows 只跑 3.10（交付目标是 Windows 桌面软件）：
  # 路径分隔符、默认编码（GBK vs UTF-8）、文件系统行为都在这里提前暴露，
  # 避免 M9-GUI 打包阶段才发现跨平台问题。
  # 用矩阵形式保持与 Linux job 结构一致，pytest / check_contracts **必须硬通过**；
  # 端到端冒烟允许 continue-on-error（Windows 上的命令行差异不应该阻塞主干）。
  test-windows:
    name: win-py${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify pinned wheels
        run: python scripts/verify_wheels.py --check

      - name: Run tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -m pytest -q --tb=no > pytest.log 2>&1
          rc=$?
          tail -40 pytest.log
          python scripts/ci_report_status.py pytest.log "$rc"
          exit $rc

      - name: Check contracts
        run: python scripts/check_contracts.py

      - name: Smoke convert (end-to-end, Windows-tolerant)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m src convert --image test_images/synthetic_line_single.png --out outputs/ci_smoke
          if (!(Test-Path outputs/ci_smoke/drawing.dxf)) { throw "missing drawing.dxf" }
          if (!(Test-Path outputs/ci_smoke/metrics_s8.json)) { throw "missing metrics_s8.json" }

